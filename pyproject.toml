[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "support-queue-doctor"
version = "1.0.0"
description = "Audit an open support queue snapshot CSV for old, unassigned, stuck, breached, and stale tickets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
support-queue-doctor = "support_queue_doctor:main_entry"

[tool.setuptools]
py-modules = ["support_queue_doctor"]
